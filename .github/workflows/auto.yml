name: Auto AltPluto Update

on:
  schedule:
    # Every 5 hours at :25 past — off the top of the hour (GitHub drops/delays
    # :00 runs). EPG for many regions is heavier than live-only, so 6h not 3h;
    # tighten to '25 */3 * * *' if you want.
    - cron: '25 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Push with a PAT when present so the auto-commits count as YOUR
          # activity and GitHub never auto-disables the schedule after 60 days.
          # Falls back to the default token until you add the KEEPALIVE_PAT secret.
          token: ${{ secrets.KEEPALIVE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate playlists + EPG (all regions + merged)
        run: python generate.py --all

      - name: Gzip every XML guide and drop the raw .xml
        run: |
          find . -type f -name '*.xml' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 gzip -f
          find . -type f -name '*.xml' -not -path './.git/*' -delete

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Auto update AltPluto playlists + EPG" || echo "No changes"
          git push --force
